<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mason · Estrategia full funnel en simple</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#20392d;font:20px/1.5 system-ui,sans-serif}main{max-width:640px;margin:9vh auto;padding:24px}h1{font-size:38px;line-height:1.15;letter-spacing:-1px}p{color:#465b50}button{font:inherit;cursor:pointer}main button{display:block;width:100%;text-align:left;background:white;color:#20392d;border:1px solid #cbd8cf;border-radius:16px;margin:16px 0;padding:23px}button:hover{background:#eaf2ed}button:focus-visible{outline:3px solid #2e7350;outline-offset:4px}small{font-size:16px;color:#52665a}dialog{border:0;border-radius:20px;width:min(520px,calc(100% - 32px));padding:28px;max-height:85dvh;overflow:auto;color:#20392d}dialog::backdrop{background:#152d246b}h2{font-size:27px;line-height:1.25;margin-top:0}dialog button{background:#245f40;color:white;border:0;border-radius:10px;padding:12px 20px;width:100%;margin-top:12px}dialog button:hover{background:#18462d}details{font-size:16px;margin-top:16px}summary{cursor:pointer;font-weight:600;margin-bottom:10px}a{color:#245f40}.ask{background:#edf4ef;border-radius:12px;padding:16px}b{color:#20392d}
</style></head><body><main><small>MASON · ESTRATEGIA FULL FUNNEL</small><h1>Cómo mejorar<br>las ventas de Mason.</h1><p>El consolidado completo, explicado en tres puntos.</p><button data-step="0">1. ¿Qué está pasando? →</button><button data-step="1">2. ¿Qué proponemos hacer? →</button><button data-step="2">3. ¿Qué hay que decidir? →</button><small>Resumen del consolidado · Datos al 4/11/2026.</small></main><dialog aria-labelledby="title"><h2 id="title"></h2><p id="explain"></p><p class="ask" id="ask"></p><button autofocus>Cerrar</button></dialog><script>
const steps=[["¿Qué está pasando?", "Google aparece asociado a más pedidos y a menor costo que Meta en los datos analizados. Además, muchos pedidos vienen de clientes que vuelven a comprar.", "<b>El problema:</b> estamos gastando sin tener claro cuánto aporta cada canal a las ventas.<details><summary>Un ejemplo con los datos</summary>Del 1 de octubre al 4 de noviembre, la tienda registra 212 pedidos asociados a Google y 34 a Meta por el último enlace de campaña usado. Meta reporta más compras con su propio método.<br><br>Eso no demuestra que Meta no ayude: alguien puede ver un anuncio allí y luego buscar Mason en Google. Falta medir ese aporte. En octubre, el 53 % de los pedidos fueron recompras.</details>"], ["¿Qué proponemos hacer?", "Usar Meta para despertar interés y resolver dudas; Google para captar a quien busca comprar; y seguimiento para facilitar que los clientes vuelvan.", "<b>La propuesta:</b> aumentar Google poco a poco y comprobar el resultado antes de seguir subiendo.<details><summary>¿Cómo se convierte eso en ventas?</summary><b>1. Interés:</b> videos con personas reales que respondan preguntas del público.<br><br><b>2. Compra:</b> producto, precio y envío claros; ayuda por WhatsApp y revisión de pagos fallidos.<br><br><b>3. Recompra:</b> seguimiento y recordatorios con consentimiento, sin asumir que todos necesitan comprar en una fecha fija.<br><br>El consolidado propone mejorar y medir Meta antes de aumentar su inversión. TikTok queda sin presupuesto de ventas hasta corregir la medición y contar con contenido de creadores. Son propuestas, no acciones ya ejecutadas.</details>"], ["¿Qué hay que decidir?", "Renzo debe decidir el reparto de inversión. Con Víctor hay que cerrar contenidos, atención y costos para poder evaluar si las ventas dejan dinero.", "<b>Pregunta para la reunión:</b> «¿Aprobamos una prueba gradual, quién hace cada parte y cuándo revisamos las ventas y los costos?»<details><summary>Las decisiones concretas</summary><b>Inversión:</b> el consolidado propone US$ 1.500 para Google, US$ 1.700 para Meta y US$ 300 de reserva o contenido, dentro de una bolsa de US$ 3.500. El reparto es una propuesta; confirmar el alcance de la bolsa antes de ejecutarlo.<br><br><b>Costos:</b> obtener margen real por producto, envío y comisiones. Sin eso, las proyecciones no demuestran ganancia.<br><br><b>Medición:</b> corregir y comprobar el conteo de compras; separar en Google las búsquedas de Mason y las búsquedas sin marca; evaluar una prueba del aporte real de Meta.<br><br><b>Ejecución:</b> asignar responsables y fechas. Tu contrato contempla recomendaciones en Google; su gestión requiere un acuerdo escrito distinto.<br><br>Revisar semanalmente el gasto, los pedidos y el costo de conseguirlos. Aumentar Google no garantiza que conserve el mismo costo ni que se cumplan las proyecciones.</details>"]];const d=document.querySelector('dialog');document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const t=steps[+b.dataset.step];document.querySelector('#title').textContent=t[0];document.querySelector('#explain').textContent=t[1];document.querySelector('#ask').innerHTML=t[2];d.showModal();});d.querySelector('button').onclick=()=>d.close();
</script></body></html>
